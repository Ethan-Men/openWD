name: IPTV Update

on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时运行一次
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - run: pip install requests

    - run: python iptv.py

    - name: Commit result
      run: |
        git config --global user.name "bot"
        git config --global user.email "bot@example.com"
        git add .
        git commit -m "update iptv" || echo "no change"
        git push
