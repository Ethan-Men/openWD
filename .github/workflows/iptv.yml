name: IPTV Auto Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install deps
      run: pip install -r requirements.txt

    - name: Run script
      run: python -u iptv.py

    - name: Commit result
      run: |
        git config user.name "bot"
        git config user.email "bot@example.com"
        git add .
        git diff --quiet || git commit -m "auto update iptv"
        git push